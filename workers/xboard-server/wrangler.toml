name = "xboard-server"
main = "src/index.ts"
compatibility_date = "2026-06-26"

[cache]
enabled = true

[[d1_databases]]
binding = "XBOARD_DB"
database_name = "xboard-db"

[[kv_namespaces]]
binding = "XBOARD_KV"

[[queues.producers]]
binding = "TRAFFIC_EVENTS"
queue = "traffic-events"

[[analytics_engine_datasets]]
binding = "RUNTIME_ANALYTICS"
dataset = "xboard_runtime"

[[durable_objects.bindings]]
name = "NODE_HUB"
class_name = "NodeHub"

[[durable_objects.bindings]]
name = "STATUS_HUB"
class_name = "StatusHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NodeHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["StatusHub"]

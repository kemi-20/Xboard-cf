name = "xboard-jobs"
main = "src/index.ts"
compatibility_date = "2026-06-26"
workers_dev = false

[[d1_databases]]
binding = "XBOARD_DB"
database_name = "xboard-db"

[[kv_namespaces]]
binding = "XBOARD_KV"

[[durable_objects.bindings]]
name = "TRAFFIC_STATS_HUB"
class_name = "TrafficStatsHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TrafficStatsHub"]

[[queues.producers]]
binding = "NOTIFICATION_EVENTS"
queue = "notification-events"

[[services]]
binding = "XBOARD_SERVER"
service = "xboard-server"

[[queues.consumers]]
queue = "traffic-events"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "traffic-events-dlq"

[[queues.consumers]]
queue = "notification-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "notification-events-dlq"

[triggers]
crons = ["* * * * *"]

name = "xboard-jobs"
main = "src/index.ts"
compatibility_date = "2026-06-26"
account_id = "CLOUDFLARE_ACCOUNT_ID"
workers_dev = false

[[d1_databases]]
binding = "XBOARD_DB"
database_name = "xboard-db"
database_id = "D1_DATABASE_ID"

[[kv_namespaces]]
binding = "XBOARD_KV"
id = "KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "TRAFFIC_STATS_HUB"
class_name = "TrafficStatsHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TrafficStatsHub"]

[[analytics_engine_datasets]]
binding = "USER_TRAFFIC_ANALYTICS"
dataset = "xboard_user_traffic"

[[analytics_engine_datasets]]
binding = "SERVER_TRAFFIC_ANALYTICS"
dataset = "xboard_server_traffic"

[[queues.consumers]]
queue = "traffic-events"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "traffic-events-dlq"

[[queues.consumers]]
queue = "mail-events"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "mail-events-dlq"

[[queues.consumers]]
queue = "telegram-events"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "telegram-events-dlq"

name = "xboard-edge"
main = "src/index.ts"
compatibility_date = "2026-06-26"
[cache]
enabled = true

[[d1_databases]]
binding = "XBOARD_DB"
database_name = "xboard-db"

[[kv_namespaces]]
binding = "XBOARD_KV"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/health", "/admin", "/admin/*", "/api/*", "/ws"]

[[services]]
binding = "XBOARD_SERVER"
service = "xboard-server"

[[services]]
binding = "XBOARD_JOBS"
service = "xboard-jobs"

[[queues.producers]]
binding = "NOTIFICATION_EVENTS"
queue = "notification-events"

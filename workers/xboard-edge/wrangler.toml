name = "xboard-edge"
main = "src/index.ts"
compatibility_date = "2026-06-26"
account_id = "CLOUDFLARE_ACCOUNT_ID"

[[d1_databases]]
binding = "XBOARD_DB"
database_name = "xboard-db"
database_id = "D1_DATABASE_ID"

[[kv_namespaces]]
binding = "XBOARD_KV"
id = "KV_NAMESPACE_ID"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/health", "/admin", "/admin/*", "/api/*", "/ws"]

[[services]]
binding = "XBOARD_SERVER"
service = "xboard-server"

[[services]]
binding = "XBOARD_SUBSCRIPTION"
service = "xboard-subscription"

[[services]]
binding = "XBOARD_ANALYTICS"
service = "xboard-analytics"

[[services]]
binding = "XBOARD_JOBS"
service = "xboard-jobs"

[[queues.producers]]
binding = "MAIL_EVENTS"
queue = "mail-events"

[[queues.producers]]
binding = "TELEGRAM_EVENTS"
queue = "telegram-events"

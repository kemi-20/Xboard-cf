name: Bootstrap XBoard on Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            workers/xboard-edge/package-lock.json
            workers/xboard-server/package-lock.json
            workers/xboard-jobs/package-lock.json
            workers/xboard-cron/package-lock.json
            workers/xboard-analytics/package-lock.json

      - name: Validate token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Repository secret CLOUDFLARE_API_TOKEN is required." >&2
            exit 1
          fi

      - name: Create or reuse Cloudflare resources
        id: resources
        run: node scripts/prepare-cloudflare-ci.mjs

      - name: Persist Cloudflare resource bindings
        shell: bash
        run: |
          if git diff --quiet -- workers/*/wrangler.toml; then
            echo "Cloudflare resource bindings already match this account."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/*/wrangler.toml
          git commit -m "Configure Cloudflare resource bindings"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Install Worker dependencies
        shell: bash
        run: |
          for worker in xboard-edge xboard-server xboard-jobs xboard-cron xboard-analytics; do
            npm ci --prefix "workers/$worker"
          done

      - name: Initialize D1 schema and seed data
        working-directory: workers/xboard-edge
        run: |
          npx wrangler d1 execute xboard-db --remote --file ../../schema/d1.sql
          npx wrangler d1 execute xboard-db --remote --file ../../schema/seed.sql

      - name: Deploy xboard-analytics
        working-directory: workers/xboard-analytics
        run: npx wrangler deploy

      - name: Configure Analytics Engine query token
        if: env.CLOUDFLARE_ANALYTICS_TOKEN != ''
        working-directory: workers/xboard-analytics
        shell: bash
        run: printf '%s' "$CLOUDFLARE_ANALYTICS_TOKEN" | npx wrangler secret put ANALYTICS_API_TOKEN

      - name: Analytics Engine disabled notice
        if: env.CLOUDFLARE_ANALYTICS_TOKEN == ''
        shell: bash
        run: echo "CLOUDFLARE_ANALYTICS_TOKEN is not configured; analytics queries will use the D1 fallback." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy xboard-server
        working-directory: workers/xboard-server
        run: npx wrangler deploy

      - name: Deploy xboard-jobs
        working-directory: workers/xboard-jobs
        run: npx wrangler deploy

      - name: Deploy xboard-cron
        working-directory: workers/xboard-cron
        run: npx wrangler deploy

      - name: Deploy xboard-edge
        working-directory: workers/xboard-edge
        run: npx wrangler deploy

      - name: Show Cloudflare Workers Builds connection steps
        if: always() && steps.resources.outcome == 'success'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.resources.outputs.account_id }}
        run: |
          {
            echo "## Cloudflare bootstrap result"
            echo
            echo "The Cloudflare resources and existing Workers were bootstrapped by Wrangler."
            echo "The generated account, D1, and KV identifiers were committed to \`${GITHUB_REF_NAME}\`, so Workers Builds can reuse the same bindings on later pushes."
            echo
            echo "> Before running the connection steps, install/authorize the [Cloudflare Workers & Pages GitHub App](https://github.com/apps/cloudflare-workers-and-pages) for this repository. Git repository access cannot be granted by a Cloudflare API token; this GitHub security boundary has no supported Wrangler or Cloudflare REST API equivalent."
            echo
            echo "Use the same repository and branch for all five connections:"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Production branch: \`${GITHUB_REF_NAME}\`"
            echo "- Build command: \`npm ci && npm run typecheck && npm test\`"
            echo "- Deploy command: \`npx wrangler deploy\`"
            echo
            echo "| Worker | Root directory | Builds settings |"
            echo "| --- | --- | --- |"
            for worker in xboard-edge xboard-server xboard-jobs xboard-cron xboard-analytics; do
              echo "| \`$worker\` | \`workers/$worker\` | [Open settings](https://dash.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/workers/services/view/$worker/production/settings/builds) |"
            done
            echo
            echo "After these five one-time connections, pushes to \`${GITHUB_REF_NAME}\` are built and deployed by Cloudflare Workers Builds. This workflow remains manual and is not the push deployment mechanism."
          } >> "$GITHUB_STEP_SUMMARY"
